name: Generate and Publish RSS

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'  # каждые 6 часов

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6

      # ---------- Cloudflare WARP ----------
      - name: Start Cloudflare WARP (VPN to bypass Azure IP block)
        uses: fscarmen/warp-on-actions@v1.4
        # free mode works without a token; uncomment the block below if you have a WARP+ token
        # with:
        #   warp-token: ${{ secrets.CLOUDFLARE_WARP_TOKEN }}

      # ---------- Debug – show public IPs after WARP ----------
      - name: Show public IPs (debug)
        run: |
          echo "🟢 IPv4 after WARP: $(curl -s -4 https://api.ipify.org)"
          echo "🟢 IPv6 after WARP: $(curl -s -6 https://api64.ipify.org)"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4 feedgen python-dotenv

      - name: Generate RSS feed
        env:
          LJ_URL: ${{ secrets.LJ_URL }}
          LJ_EXCLUDED_TAGS: ${{ secrets.LJ_EXCLUDED_TAGS }}
        run: |
          mkdir -p docs
          # download current feed as cache (ignore errors)
          curl -s -f -o docs/dekodeko_lj_feed.xml https://sergepetroff.github.io/DekoRss/dekodeko_lj_feed.xml || true
          # run scraper; fallback logic inside the script handles missing posts
          python main_scraper.py
          # move generated feed only if it exists
          if [ -f dekodeko_lj_feed.xml ]; then
            mv dekodeko_lj_feed.xml docs/
            echo "✅ New feed moved to docs/"
          else
            echo "⚠️ Feed not generated – keeping cached version"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Keep GitHub Actions alive (anti-inactivity timeout)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: prevent workflow auto-disable" || echo "Nothing to commit"
          git push origin main || echo "Keepalive push skipped"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
